name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: luma
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: luma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U luma -d luma_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgres://luma:local-ci-only@127.0.0.1:5432/luma_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_PROCESS_RECOVERY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cp .env.example .env
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t luma-support:test .
