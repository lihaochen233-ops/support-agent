name: luma
x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://luma:${POSTGRES_PASSWORD:?Generate .env first}@postgres:5432/luma?sslmode=disable
    REDIS_URL: redis://:${REDIS_PASSWORD:?Generate .env first}@redis:6379/0
    UPLOAD_DIR: /data
    STATIC_DIR: /app/frontend/dist
    APP_ADDR: :8090
  volumes: [uploads:/data]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 15s
  healthcheck:
    test: [CMD, /app/server, -check]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: luma
      POSTGRES_DB: luma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U luma -d luma']
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env first}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 30
  init:
    <<: *app
    command: [-init]
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
    depends_on:
      init: { condition: service_completed_successfully }
  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
    depends_on:
      init: { condition: service_completed_successfully }
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8090}:80"]
    volumes: [./deploy/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  uploads:
