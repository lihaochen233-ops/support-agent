name: verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: luma
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: luma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U luma -d luma_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgres://luma:local-ci-only@127.0.0.1:5432/luma_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_PROCESS_RECOVERY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
      - name: Prepare isolated deployment configuration
        run: |
          sh -n scripts/setup.sh
          sh scripts/setup.sh
          before=$(sha256sum .env)
          sh scripts/setup.sh
          test "$before" = "$(sha256sum .env)"
          docker compose config --quiet
      - name: Start both application instances
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify gateway and instance failover
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8090/ > /dev/null
          curl --fail http://localhost:8090/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["db"] and d["redis"]'
          docker compose stop app1
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8090/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["redis"] and d["instance_id"] == "app2"'
      - name: Deployment logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop deployment
        if: always()
        run: docker compose down